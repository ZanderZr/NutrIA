<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <style>
    .line { stroke: #566072; }
    .fillsoft { fill: #566072; opacity: .10; }
    .accent { stroke: #12a150; }
    .accent-f { fill: #12a150; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #9aa4ab; }
      .fillsoft { fill: #ffffff; opacity: .06; }
      .accent { stroke: #2fd07a; }
      .accent-f { fill: #2fd07a; }
    }
  </style>
  <!-- browser window -->
  <rect x="70" y="55" width="260" height="150" rx="12" class="fillsoft"/>
  <rect x="70" y="55" width="260" height="150" rx="12" class="line" stroke-width="3"/>
  <line x1="70" y1="85" x2="330" y2="85" class="line" stroke-width="3"/>
  <circle cx="88" cy="70" r="4" class="line" stroke-width="2"/>
  <circle cx="104" cy="70" r="4" class="line" stroke-width="2"/>
  <circle cx="120" cy="70" r="4" class="line" stroke-width="2"/>
  <rect x="150" y="63" width="165" height="14" rx="7" class="line" stroke-width="2"/>
  <!-- content: aistudio -->
  <text x="200" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" class="accent-f">Google AI Studio</text>
  <rect x="150" y="155" width="100" height="26" rx="13" class="accent" stroke-width="3"/>
  <text x="200" y="173" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" class="accent-f">Sign in</text>
  <!-- external arrow -->
  <path d="M295 100 h20 v20 M315 100 l-26 26" class="accent" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
